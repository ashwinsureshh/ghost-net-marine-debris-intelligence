<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Operator console for the Ghost Net & Marine Debris Intelligence Pipeline — a decision-support research prototype."
    />
    <title>Ghost Net Operator Console</title>
    <script>
      // Set the theme before first paint so a reload never flashes the wrong one.
      // Light is the default; only an explicit stored choice or an OS
      // dark-mode preference switches to dark.
      (function () {
        try {
          var stored = localStorage.getItem("ghostnet-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          /* localStorage blocked — keep the default light class */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
